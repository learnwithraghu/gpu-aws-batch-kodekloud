<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KodeFood Vendor Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div class="brand-group">
        <h1 class="brand">Kode<span>Food</span> Vendor Portal</h1>
        <span class="subtitle">Restaurant Partner Menu Management</span>
      </div>
      <span class="mode-pill">Partner Console</span>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash{% if category == 'error' %} error{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
